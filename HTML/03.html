<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h3 style="color: ;">Feedback Form</h3>
    <form action="/server">

        <div>
            <label for="name">Name:</label>
            <input type="text" placeholder="write your name" id="name" name="name">
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" placeholder="write your email" id="email" name="email">
        </div>
        <br>
        <div>
            <label for="msg">Message:</label><br>
            <textarea id="msg"></textarea>
        </div>
        <br>
        <div>
            <label for="rate">Rate us out of 5:</label><br>
            <input type="radio" name="rate" value="1" id="1">
            <label for="1">1</label><br>
            <input type="radio" name="rate" value="2" id="2">
            <label for="2">2</label><br>
            <input type="radio" name="rate" value="3" id="3">
            <label for="3">3</label><br>
            <input type="radio" name="rate" value="4" id="4">
            <label for="4">4</label><br>
            <input type="radio" name="rate" value="5" id="5">
            <label for="5">5</label>
        </div><br>
        <button>send your message</button>
        
    </form>
</body>
</html>
