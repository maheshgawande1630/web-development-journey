<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Into A Black Hole</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#title{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    z-index:10;
    pointer-events:none;
}

#title h1{
    font-size:4rem;
    letter-spacing:8px;
    text-transform:uppercase;
}

#title p{
    margin-top:20px;
    opacity:0.8;
}

#fps{
    position:absolute;
    top:10px;
    right:10px;
    color:#00ffcc;
    font-size:14px;
}
</style>

</head>
<body>

<div id="title">
    <h1>BLACK HOLE</h1>
    <p>Move Mouse • Explore Space</p>
</div>

<div id="fps">FPS: 0</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

//////////////////////////////////////////////////
// STARFIELD
//////////////////////////////////////////////////

const starGeometry = new THREE.BufferGeometry();

const starCount = 50000;

const positions = new Float32Array(starCount*3);

for(let i=0;i<starCount*3;i++){
    positions[i]=(Math.random()-0.5)*2000;
}

starGeometry.setAttribute(
'position',
new THREE.BufferAttribute(positions,3)
);

const starMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:1.2,
sizeAttenuation:true
});

const stars = new THREE.Points(
starGeometry,
starMaterial
);

scene.add(stars);

//////////////////////////////////////////////////
// BLACK HOLE CORE
//////////////////////////////////////////////////

const blackHoleGeometry =
new THREE.SphereGeometry(18,128,128);

const blackHoleMaterial =
new THREE.MeshBasicMaterial({
color:0x000000
});

const blackHole =
new THREE.Mesh(
blackHoleGeometry,
blackHoleMaterial
);

scene.add(blackHole);

//////////////////////////////////////////////////
// OUTER GLOW
//////////////////////////////////////////////////

const glowGeometry =
new THREE.SphereGeometry(22,128,128);

const glowMaterial =
new THREE.MeshBasicMaterial({
color:0x4411ff,
transparent:true,
opacity:0.12
});

const glow =
new THREE.Mesh(
glowGeometry,
glowMaterial
);

scene.add(glow);

//////////////////////////////////////////////////
// ACCRETION DISK
//////////////////////////////////////////////////

const diskGeometry =
new THREE.RingGeometry(
25,
55,
256
);

const diskMaterial =
new THREE.MeshBasicMaterial({
color:0xff6600,
side:THREE.DoubleSide,
transparent:true,
opacity:0.9
});

const disk =
new THREE.Mesh(
diskGeometry,
diskMaterial
);

disk.rotation.x = Math.PI/2.5;

scene.add(disk);

//////////////////////////////////////////////////
// SECOND HOT DISK
//////////////////////////////////////////////////

const disk2Geometry =
new THREE.RingGeometry(
30,
48,
256
);

const disk2Material =
new THREE.MeshBasicMaterial({
color:0xffff66,
side:THREE.DoubleSide,
transparent:true,
opacity:0.7
});

const disk2 =
new THREE.Mesh(
disk2Geometry,
disk2Material
);

disk2.rotation.x =
Math.PI/2.5;

scene.add(disk2);

//////////////////////////////////////////////////
// PARTICLE CLOUD
//////////////////////////////////////////////////

const particleGeometry =
new THREE.BufferGeometry();

const particleCount = 10000;

const particlePos =
new Float32Array(
particleCount*3
);

for(let i=0;i<particleCount;i++){

let angle=Math.random()*Math.PI*2;
let radius=25+Math.random()*40;

particlePos[i*3] =
Math.cos(angle)*radius;

particlePos[i*3+1] =
(Math.random()-0.5)*4;

particlePos[i*3+2] =
Math.sin(angle)*radius;
}

particleGeometry.setAttribute(
'position',
new THREE.BufferAttribute(
particlePos,
3
)
);

const particleMaterial =
new THREE.PointsMaterial({
color:0xffaa00,
size:1,
transparent:true,
opacity:0.8
});

const plasma =
new THREE.Points(
particleGeometry,
particleMaterial
);

scene.add(plasma);

//////////////////////////////////////////////////
// LIGHTS
//////////////////////////////////////////////////

const ambient =
new THREE.AmbientLight(
0xffffff,
0.6
);

scene.add(ambient);

const pointLight =
new THREE.PointLight(
0xff8800,
10,
500
);

scene.add(pointLight);

//////////////////////////////////////////////////
// MOUSE CONTROL
//////////////////////////////////////////////////

let mouseX=0;
let mouseY=0;

document.addEventListener(
'mousemove',
(e)=>{
mouseX=
(e.clientX/window.innerWidth-0.5)*2;

mouseY=
(e.clientY/window.innerHeight-0.5)*2;
}
);

//////////////////////////////////////////////////
// FPS COUNTER
//////////////////////////////////////////////////

let fpsCounter =
document.getElementById('fps');

let frames=0;
let lastTime=performance.now();

//////////////////////////////////////////////////
// ANIMATION
//////////////////////////////////////////////////

function animate(){

requestAnimationFrame(
animate
);

const t =
performance.now()*0.001;

//////////////////////////////////////////////////
// STAR ROTATION
//////////////////////////////////////////////////

stars.rotation.y += 0.0002;
stars.rotation.x += 0.00005;

//////////////////////////////////////////////////
// DISK SPIN
//////////////////////////////////////////////////

disk.rotation.z += 0.015;
disk2.rotation.z -= 0.025;

//////////////////////////////////////////////////
// PLASMA MOTION
//////////////////////////////////////////////////

plasma.rotation.y += 0.03;

//////////////////////////////////////////////////
// GLOW PULSE
//////////////////////////////////////////////////

glow.scale.setScalar(
1+Math.sin(t*2)*0.03
);

//////////////////////////////////////////////////
// CAMERA FLOAT
//////////////////////////////////////////////////

camera.position.x +=
(mouseX*20-camera.position.x)
*0.02;

camera.position.y +=
(-mouseY*15-camera.position.y)
*0.02;

camera.lookAt(
blackHole.position
);

//////////////////////////////////////////////////
// FPS
//////////////////////////////////////////////////

frames++;

if(performance.now()-lastTime>1000){

fpsCounter.innerHTML =
"FPS: "+frames;

frames=0;
lastTime=performance.now();
}

renderer.render(
scene,
camera
);

}

animate();

//////////////////////////////////////////////////
// RESIZE
//////////////////////////////////////////////////

window.addEventListener(
'resize',
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
