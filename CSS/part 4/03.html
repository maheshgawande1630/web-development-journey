<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positioning</title>
    <link rel="stylesheet" href="01.css">
</head>
<body>
    <section>
        <h3>Static position</h3>
        <div id="first"></div>
        <div id="static" class="second block"></div>
    </section>

    <section >
        <h3>Relative position</h3>
        <div id="first"></div>
        <div id="relative" class="second block"> Relative block</div>
    </section>

    <section>
        <h3>Absolute position</h3>
        <div id="first"></div>
        <div id="absolute" class="second block">absolute</div>
    </section>

    <section>
        <h3>Fixied position</h3>
        <div id="first"></div>
        <div id="fixed" class="second block">fixed</div>
    </section>

</body>
</html>
