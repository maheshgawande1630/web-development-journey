<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<div id="main">

  <!-- NAVBAR -->
   <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
      Mahesh Gawande
      </a>
      <div class="navbar-nav">
        <a class="nav-link" href="#">Home </a>
        <a class="nav-link" href="#"> Contact</a>
        <a class="nav-link" href="#">About us</a>
      </div>
    
    </div>
   </nav>

  <!-- buttons -->
  <div id="button">
    <button type="button" class="btn" data-bs-toggle="button">Toggle button</button>
    <button type="button" class="btn active" data-bs-toggle="button" aria-pressed="true">Active toggle button</button>
    <button type="button" class="btn" disabled data-bs-toggle="button">Disabled toggle button</button>

    <button type="button" class="btn btn-primary" data-bs-toggle="button">Toggle button</button>
    <button type="button" class="btn btn-primary active" data-bs-toggle="button" aria-pressed="true">Active toggle button</button>
    <button type="button" class="btn btn-primary" disabled data-bs-toggle="button">Disabled toggle button</button>
  </div>

  <!-- badges -->
  <div>
    <button class="btn btn-outline-secondary" id="btn1">
      Notifications <span class="badge bg-dark">99+</span>
    </button>
    <button class="btn btn-outline-secondary position-relative">followers <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">5 new</span></button>
  </div>


  <!-- Alert -->
  <div id="alert">
    <div class="alert alert-danger alert-dismissible fade show">Varification Failed  <button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="alert alert-success alert-dismissible fade show">Congratulations you are selected !! <button class="btn-close" data-bs-dismiss="alert"></button></div>
    <div class="alert alert-warning alert-dismissible fade show">It might be harmful !! <button class="btn-close" data-bs-dismiss="alert"></button></div>
  </div>

  <!-- button group -->
  <div class="btn-group">
    <button class="btn btn-outline-dark">One</button>
    <button class="btn btn-outline-dark">Two</button>
    <button class="btn btn-outline-dark">Three</button>
  </div>

  <!-- Cards -->
   <div class="card" style="width: 18rem;" id="card">
    <img src="images.jpeg" class="card-img-top">
    <div class="card-body">
      <h5 class="card-title">Transportation</h5>
      <p class="card-text">We are the best transporter ,our policy covers all damage expence if any happend by us</p>
      <a href="#" class="btn btn-outline-dark">Know more</a>
    </div>
   </div>


   <!-- Grid -->
    <div class="container" id="grid">

      <div class="row ">
        <div class="col-4 bg-success text-center">First</div>
        <div class="col-2 bg-warning text-center">Second</div>
        <div class="col-2 bg-danger text-center">Third</div>
        <div class="col-4 bg-warning text-center">Fourth</div>
      </div>

    </div>


    <!-- Forms  -->

    <div class="container">

      <form class="mb-3">

        <div class="mb-3">
          <label for="name" class="form-label">Name :</label>
          <input type="text" class="form-control" id="name" placeholder="Enter your name"/>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address :</label>
          <input type="text" class="form-control" id="address" placeholder="Enter your name"/> 
        </div>

        <div class="mb-3">
          <label class="form-label" for="pass">Password :</label>
          <input type="password" id="pass" placeholder="Enter your password" class="form-control">
        </div>

         <div class="mb-3 form-check">
          <label class="form-check-label" for="agree">Agree</label>
          <input class="form-check-input" id="agree" type="radio">
        </div>

        <div class="mb-3 form-check">
          <label class="form-check-label" for="agreecheck">Agree</label>
          <input class="form-check-input" id="agreecheck" type="checkbox">
        </div>


        
      </form>


    </div>



</div>

   
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
